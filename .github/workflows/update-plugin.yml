name: update plugin
on:
  push:
  workflow_dispatch:
    inputs:
      plugin:
        type: choice
        description: Update plugin
        options:
          - chartjs-keyboard-plugin
          - chartjs-legend-keyboard-plugin
env:
  plugin: 'prettier-config'
jobs:
  pipeline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: echo "${{ github.event.inputs.plugin }}"
  exp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: install
        run: npm ci
      - name: check version
        id: check-version
        run: |
          LATEST_VERSION=$(npm view @kuzanatoliorg/${{ env.plugin }} version)
          LATEST_MAJOR_VERSION=$(echo $LATEST_VERSION | cut -d. -f1)
          CURRENT_VERSION=$(npm list @kuzanatoliorg/${{ env.plugin }} --json | jq -r '.dependencies.["@kuzanatoliorg/${{ env.plugin }}"].version')
          CURRENT_MAJOR_VERSION=$(echo $CURRENT_VERSION | cut -d. -f1)
          if [ "$CURRENT_MAJOR_VERSION" = "$LATEST_MAJOR_VERSION" ]; then
            echo "IS_MAJOR_VERSION_OUTDATED=false" >> $GITHUB_OUTPUT
          else
            echo "IS_MAJOR_VERSION_OUTDATED=true" >> $GITHUB_OUTPUT
          fi
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "IS_VERSION_OUTDATED=false" >> $GITHUB_OUTPUT
          else
            echo "IS_VERSION_OUTDATED=true" >> $GITHUB_OUTPUT
          fi
      - name: add git artifacts
        run: |
          git config --global user.email "njkznu@gmail.com"
          git config --global user.name "kuzanatoliy"
      - name: major update
        if: ${{ steps.check-version.outputs.IS_MAJOR_VERSION_OUTDATED == 'true' }}
        run: echo ${{ steps.check-version.outputs.IS_MAJOR_VERSION_OUTDATED }}
      - name: minor update
        if: ${{ steps.check-version.outputs.IS_MAJOR_VERSION_OUTDATED == 'false' && steps.check-version.outputs.IS_VERSION_OUTDATED == 'true' }}
        run: echo ${{ steps.check-version.outputs.IS_VERSION_OUTDATED }}
